<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">
  <rect width="800" height="700" fill="#fafafa"/>

  <text x="400" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">PMF 五维雷达</text>
  <text x="400" y="78" text-anchor="middle" font-size="13" fill="#6b7280">示例分值：判断一个产品 PMF 强不强</text>

  <!-- 雷达图中心 (400, 380) 半径 220 -->
  <g transform="translate(400,380)">
    <!-- 五层网格（20/40/60/80/100） -->
    <g fill="none" stroke="#e5e7eb" stroke-width="1">
      <!-- 100 -->
      <polygon points="0,-220 209.6,26.5 129.4,178.5 -129.4,178.5 -209.6,26.5"/>
      <!-- 80 -->
      <polygon points="0,-176 167.7,21.2 103.5,142.8 -103.5,142.8 -167.7,21.2"/>
      <!-- 60 -->
      <polygon points="0,-132 125.7,15.9 77.6,107.1 -77.6,107.1 -125.7,15.9"/>
      <!-- 40 -->
      <polygon points="0,-88 83.8,10.6 51.8,71.4 -51.8,71.4 -83.8,10.6"/>
      <!-- 20 -->
      <polygon points="0,-44 41.9,5.3 25.9,35.7 -25.9,35.7 -41.9,5.3"/>
    </g>

    <!-- 轴线 -->
    <g stroke="#d1d5db" stroke-width="1">
      <line x1="0" y1="0" x2="0" y2="-220"/>
      <line x1="0" y1="0" x2="209.6" y2="26.5"/>
      <line x1="0" y1="0" x2="129.4" y2="178.5"/>
      <line x1="0" y1="0" x2="-129.4" y2="178.5"/>
      <line x1="0" y1="0" x2="-209.6" y2="26.5"/>
    </g>

    <!-- 数据多边形 (80/70/60/75/55) -->
    <!--  80: 0, -176
          70: 146.7, 18.5
          60: 77.6, 107.1
          75: -97.1, 133.9
          55: -115.3, 14.6 -->
    <polygon points="0,-176 146.7,18.5 77.6,107.1 -97.1,133.9 -115.3,14.6"
             fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="2.5"/>

    <!-- 数据点 -->
    <g fill="#3b82f6">
      <circle cx="0" cy="-176" r="5"/>
      <circle cx="146.7" cy="18.5" r="5"/>
      <circle cx="77.6" cy="107.1" r="5"/>
      <circle cx="-97.1" cy="133.9" r="5"/>
      <circle cx="-115.3" cy="14.6" r="5"/>
    </g>

    <!-- 标签 -->
    <g font-size="14" fill="#111827" font-weight="600">
      <text x="0" y="-240" text-anchor="middle">需求真实</text>
      <text x="0" y="-222" text-anchor="middle" fill="#3b82f6" font-size="13" font-weight="700">80</text>

      <text x="230" y="20" text-anchor="start">需求真实</text>
      <text x="230" y="40" text-anchor="start" fill="#3b82f6" font-size="13" font-weight="700">70</text>

      <text x="148" y="195" text-anchor="middle">付费意愿</text>
      <text x="148" y="215" text-anchor="middle" fill="#3b82f6" font-size="13" font-weight="700">60</text>

      <text x="-148" y="195" text-anchor="middle">工作流嵌入</text>
      <text x="-148" y="215" text-anchor="middle" fill="#3b82f6" font-size="13" font-weight="700">75</text>

      <text x="-230" y="20" text-anchor="start">单位经济</text>
      <text x="-230" y="40" text-anchor="start" fill="#3b82f6" font-size="13" font-weight="700">55</text>
    </g>
  </g>

  <!-- 底部图例 -->
  <g transform="translate(0,640)">
    <rect x="80" y="0" width="640" height="50" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="400" y="30" text-anchor="middle" font-size="13" fill="#1e3a8a">5 个维度都 ≥ 60 才算真实 PMF；任何一项 < 40 都要警惕</text>
  </g>
</svg>
