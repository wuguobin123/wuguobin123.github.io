<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">
  <defs>
    <linearGradient id="rootBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="820" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="600" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#111827">AI 产业 12 主线一张图</text>
  <text x="600" y="78" text-anchor="middle" font-size="14" fill="#6b7280">技术链 · 商业链 · 物理链 · 平台链</text>

  <!-- 中心根节点 -->
  <g filter="url(#softShadow)">
    <rect x="450" y="358" width="300" height="100" rx="16" fill="url(#rootBg)" stroke="#f59e0b" stroke-width="2"/>
    <text x="600" y="398" text-anchor="middle" font-size="20" font-weight="700" fill="#fde68a">AI 产业</text>
    <text x="600" y="428" text-anchor="middle" font-size="22" font-weight="700" fill="#fbbf24">12 主线</text>
  </g>

  <!-- 技术链 -->
  <g filter="url(#softShadow)">
    <rect x="60" y="160" width="260" height="170" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="190" y="195" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">技术链</text>
    <line x1="80" y1="210" x2="300" y2="210" stroke="#3b82f6" stroke-width="1" opacity="0.3"/>
    <text x="190" y="240" text-anchor="middle" font-size="14" fill="#1e3a8a">Agent 与 Harness</text>
    <text x="190" y="268" text-anchor="middle" font-size="14" fill="#1e3a8a">AI Coding</text>
    <text x="190" y="296" text-anchor="middle" font-size="14" fill="#1e3a8a">中国模型三条路线</text>
    <text x="190" y="318" text-anchor="middle" font-size="11" fill="#6b7280">3 个主题</text>
  </g>

  <!-- 商业链 -->
  <g filter="url(#softShadow)">
    <rect x="470" y="160" width="260" height="260" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="600" y="195" text-anchor="middle" font-size="16" font-weight="700" fill="#b91c1c">商业链</text>
    <line x1="490" y1="210" x2="710" y2="210" stroke="#ef4444" stroke-width="1" opacity="0.3"/>
    <text x="600" y="240" text-anchor="middle" font-size="14" fill="#7f1d1d">产品 PMF</text>
    <text x="600" y="268" text-anchor="middle" font-size="14" fill="#7f1d1d">出海与全球化</text>
    <text x="600" y="296" text-anchor="middle" font-size="14" fill="#7f1d1d">融资与泡沫</text>
    <text x="600" y="324" text-anchor="middle" font-size="14" fill="#7f1d1d">组织能力</text>
    <text x="600" y="352" text-anchor="middle" font-size="14" fill="#7f1d1d">超级个体</text>
    <text x="600" y="408" text-anchor="middle" font-size="11" fill="#6b7280">5 个主题</text>
  </g>

  <!-- 物理链 -->
  <g filter="url(#softShadow)">
    <rect x="880" y="160" width="260" height="140" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="1010" y="195" text-anchor="middle" font-size="16" font-weight="700" fill="#047857">物理链</text>
    <line x1="900" y1="210" x2="1120" y2="210" stroke="#10b981" stroke-width="1" opacity="0.3"/>
    <text x="1010" y="240" text-anchor="middle" font-size="14" fill="#064e3b">自动驾驶</text>
    <text x="1010" y="268" text-anchor="middle" font-size="14" fill="#064e3b">机器人与 VLA</text>
    <text x="1010" y="290" text-anchor="middle" font-size="11" fill="#6b7280">2 个主题</text>
  </g>

  <!-- 平台链 -->
  <g filter="url(#softShadow)">
    <rect x="880" y="500" width="260" height="140" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="1010" y="535" text-anchor="middle" font-size="16" font-weight="700" fill="#6d28d9">平台链</text>
    <line x1="900" y1="550" x2="1120" y2="550" stroke="#8b5cf6" stroke-width="1" opacity="0.3"/>
    <text x="1010" y="580" text-anchor="middle" font-size="14" fill="#4c1d95">TikTok 平台增长</text>
    <text x="1010" y="608" text-anchor="middle" font-size="14" fill="#4c1d95">模型/应用/Infra 价值分配</text>
    <text x="1010" y="630" text-anchor="middle" font-size="11" fill="#6b7280">2 个主题</text>
  </g>

  <!-- 连接线：根到四个链 -->
  <g stroke="#9ca3af" stroke-width="1.5" fill="none" stroke-dasharray="4,3">
    <path d="M 190 330 L 460 408"/>
    <path d="M 600 420 L 600 420"/>
    <path d="M 1010 330 L 740 408"/>
    <path d="M 890 570 L 750 432"/>
  </g>

  <!-- 实际连接线 -->
  <g stroke="#6b7280" stroke-width="2" fill="none" opacity="0.7">
    <path d="M 190 330 Q 320 360 460 390"/>
    <path d="M 600 420 L 600 420"/>
    <path d="M 1010 300 Q 880 360 740 390"/>
    <path d="M 980 500 Q 850 470 720 430"/>
  </g>

  <!-- 底部说明 -->
  <g transform="translate(0,700)">
    <rect x="80" y="0" width="1040" height="100" rx="8" fill="#f3f4f6" stroke="#e5e7eb"/>
    <text x="600" y="30" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">四个链不是孤立的</text>
    <text x="160" y="60" font-size="13" fill="#1d4ed8">▍技术链</text>
    <text x="160" y="82" font-size="12" fill="#4b5563">决定 AI 能做什么</text>

    <text x="410" y="60" font-size="13" fill="#b91c1c">▍商业链</text>
    <text x="410" y="82" font-size="12" fill="#4b5563">决定能不能赚钱、持续</text>

    <text x="680" y="60" font-size="13" fill="#047857">▍物理链</text>
    <text x="680" y="82" font-size="12" fill="#4b5563">决定 AI 能否走出屏幕</text>

    <text x="920" y="60" font-size="13" fill="#6d28d9">▍平台链</text>
    <text x="920" y="82" font-size="12" fill="#4b5563">决定入口、用户、钱在哪</text>
  </g>
</svg>
