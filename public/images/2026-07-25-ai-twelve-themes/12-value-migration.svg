<text x="550" y="70.5" font-family="'Comic Sans MS', 'Marker Felt', sans-serif" font-size="36" fill="#1e293b" text-anchor="middle" dominant-baseline="alphabetic">AI 产业价值迁移三阶段</text>
<text x="550" y="110.25" font-family="'Comic Sans MS', 'Marker Felt', sans-serif" font-size="18" fill="#64748b" text-anchor="middle" dominant-baseline="alphabetic">（价值不会固定停在某一层）</text>
<text x="150" y="219.75" font-family="'Comic Sans MS', 'Marker Felt', sans-serif" font-size="22" fill="#7f1d1d" text-anchor="middle" dominant-baseline="alphabetic">阶段一</text>
<text x="150" y="250.25" font-family="'Comic Sans MS', 'Marker Felt', sans-serif" font-size="18" fill="#7f1d1d" text-anchor="middle" dominant-baseline="alphabetic">模型稀缺期</text>
<text x="150" y="275.75" font-family="'Comic Sans MS', 'Marker Felt', sans-serif" font-size="14" fill="#64748b" text-anchor="middle" dominant-baseline="alphabetic">2022-2024</text>
<text x="50" y="328" font-family="'Comic Sans MS', 'Marker Felt', sans-serif" font-size="16" fill="#1e293b" text-anchor="start" dominant-baseline="alphabetic">• 模型本身</text>
<text x="50" y="368" font-family="'Comic Sans MS', 'Marker Felt', sans-serif" font-size="16" fill="#1e293b" text-anchor="start" dominant-baseline="alphabetic">• GPU / 云 / 训练 Infra</text>
<text x="50" y="408" font-family="'Comic Sans MS', 'Marker Felt', sans-serif" font-size="16" fill="#1e293b" text-anchor="start" dominant-baseline="alphabetic">• 顶尖研究人才</text>
<text x="550" y="219.75" font-family="'Comic Sans MS', 'Marker Felt', sans-serif" font-size="22" fill="#92400e" text-anchor="middle" dominant-baseline="alphabetic">阶段二</text>
<text x="550" y="250.25" font-family="'Comic Sans MS', 'Marker Felt', sans-serif" font-size="18" fill="#92400e" text-anchor="middle" dominant-baseline="alphabetic">模型商品化期</text>
<text x="550" y="275.75" font-family="'Comic Sans MS', 'Marker Felt', sans-serif" font-size="14" fill="#64748b" text-anchor="middle" dominant-baseline="alphabetic">2025-2026</text>
<text x="450" y="328" font-family="'Comic Sans MS', 'Marker Felt', sans-serif" font-size="16" fill="#1e293b" text-anchor="start" dominant-baseline="alphabetic">• 用户关系</text>
<text x="450" y="368" font-family="'Comic Sans MS', 'Marker Felt', sans-serif" font-size="16" fill="#1e293b" text-anchor="start" dominant-baseline="alphabetic">• 品牌</text>
<text x="450" y="408" font-family="'Comic Sans MS', 'Marker Felt', sans-serif" font-size="16" fill="#1e293b" text-anchor="start" dominant-baseline="alphabetic">• 工作流嵌入</text>
<text x="450" y="448" font-family="'Comic Sans MS', 'Marker Felt', sans-serif" font-size="16" fill="#1e293b" text-anchor="start" dominant-baseline="alphabetic">• 私域数据 / 分发</text>
<text x="950" y="219.75" font-family="'Comic Sans MS', 'Marker Felt', sans-serif" font-size="22" fill="#5b21b6" text-anchor="middle" dominant-baseline="alphabetic">阶段三</text>
<text x="950" y="250.25" font-family="'Comic Sans MS', 'Marker Felt', sans-serif" font-size="18" fill="#5b21b6" text-anchor="middle" dominant-baseline="alphabetic">Agent 平台期</text>
<text x="950" y="275.75" font-family="'Comic Sans MS', 'Marker Felt', sans-serif" font-size="14" fill="#64748b" text-anchor="middle" dominant-baseline="alphabetic">2026+</text>
<text x="850" y="328" font-family="'Comic Sans MS', 'Marker Felt', sans-serif" font-size="16" fill="#1e293b" text-anchor="start" dominant-baseline="alphabetic">• Runtime</text>
<text x="850" y="368" font-family="'Comic Sans MS', 'Marker Felt', sans-serif" font-size="16" fill="#1e293b" text-anchor="start" dominant-baseline="alphabetic">• Context / Memory</text>
<text x="850" y="408" font-family="'Comic Sans MS', 'Marker Felt', sans-serif" font-size="16" fill="#1e293b" text-anchor="start" dominant-baseline="alphabetic">• 工具权限</text>
<text x="850" y="448" font-family="'Comic Sans MS', 'Marker Felt', sans-serif" font-size="16" fill="#1e293b" text-anchor="start" dominant-baseline="alphabetic">• 身份 / 支付 / 任务入口</text>
<text x="730" y="682.5" font-family="'Comic Sans MS', 'Marker Felt', sans-serif" font-size="20" fill="#1e293b" text-anchor="middle" dominant-baseline="alphabetic">价值会随能力、成本、入口持续迁移</text>
<text x="690" y="720.25" font-family="'Comic Sans MS', 'Marker Felt', sans-serif" font-size="18" fill="#64748b" text-anchor="middle" dominant-baseline="alphabetic">稀缺 → 模型 + 商品化 → 应用 + Agent → 控制点</text>
</svg>