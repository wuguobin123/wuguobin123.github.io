<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif">
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="1200" height="600" fill="#fafafa"/>

  <text x="600" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">AI 产业价值迁移三阶段</text>
  <text x="600" y="78" text-anchor="middle" font-size="13" fill="#6b7280">价值不会固定停在某一层，会随能力、成本、入口持续迁移</text>

  <!-- 阶段一：模型能力稀缺期 -->
  <g filter="url(#softShadow)">
    <rect x="60" y="130" width="320" height="320" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="220" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#991b1b">阶段一</text>
    <text x="220" y="198" text-anchor="middle" font-size="16" font-weight="700" fill="#b91c1c">模型能力稀缺期</text>
    <text x="220" y="220" text-anchor="middle" font-size="11" fill="#7f1d1d">2022 – 2024</text>
    <line x1="90" y1="240" x2="350" y2="240" stroke="#ef4444" stroke-width="1" opacity="0.3"/>
    <text x="220" y="270" text-anchor="middle" font-size="13" fill="#1f2937">价值集中在</text>
    <g font-size="13" fill="#7f1d1d">
      <text x="220" y="298" text-anchor="middle">▸ 模型本身</text>
      <text x="220" y="322" text-anchor="middle">▸ GPU / 云 / 训练 Infra</text>
      <text x="220" y="346" text-anchor="middle">▸ 顶尖研究人才</text>
    </g>
    <text x="220" y="395" text-anchor="middle" font-size="12" fill="#6b7280">应用差异被能力上限掩盖</text>
    <text x="220" y="418" text-anchor="middle" font-size="12" fill="#6b7280">做啥都「AI 还没那么强」</text>
  </g>

  <!-- 阶段二：模型商品化期 -->
  <g filter="url(#softShadow)">
    <rect x="440" y="130" width="320" height="320" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="600" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#92400e">阶段二</text>
    <text x="600" y="198" text-anchor="middle" font-size="16" font-weight="700" fill="#b45309">模型商品化期</text>
    <text x="600" y="220" text-anchor="middle" font-size="11" fill="#78350f">2025 – 2026</text>
    <line x1="470" y1="240" x2="730" y2="240" stroke="#f59e0b" stroke-width="1" opacity="0.3"/>
    <text x="600" y="270" text-anchor="middle" font-size="13" fill="#1f2937">价值迁移到</text>
    <g font-size="13" fill="#92400e">
      <text x="600" y="298" text-anchor="middle">▸ 用户关系</text>
      <text x="600" y="322" text-anchor="middle">▸ 品牌</text>
      <text x="600" y="346" text-anchor="middle">▸ 工作流嵌入</text>
      <text x="600" y="370" text-anchor="middle">▸ 私域数据 / 分发</text>
    </g>
    <text x="600" y="418" text-anchor="middle" font-size="12" fill="#6b7280">应用层差异化开始显现</text>
  </g>

  <!-- 阶段三：Agent 平台期 -->
  <g filter="url(#softShadow)">
    <rect x="820" y="130" width="320" height="320" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="980" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#5b21b6">阶段三</text>
    <text x="980" y="198" text-anchor="middle" font-size="16" font-weight="700" fill="#6d28d9">Agent 平台期</text>
    <text x="980" y="220" text-anchor="middle" font-size="11" fill="#4c1d95">2026 +</text>
    <line x1="850" y1="240" x2="1110" y2="240" stroke="#8b5cf6" stroke-width="1" opacity="0.3"/>
    <text x="980" y="270" text-anchor="middle" font-size="13" fill="#1f2937">价值迁移到</text>
    <g font-size="13" fill="#5b21b6">
      <text x="980" y="298" text-anchor="middle">▸ Runtime</text>
      <text x="980" y="322" text-anchor="middle">▸ Context / Memory</text>
      <text x="980" y="346" text-anchor="middle">▸ 工具权限</text>
      <text x="980" y="370" text-anchor="middle">▸ 身份 / 支付 / 任务入口</text>
    </g>
    <text x="980" y="418" text-anchor="middle" font-size="12" fill="#6b7280">谁掌握长期任务，谁掌握分发</text>
  </g>

  <!-- 箭头连接 -->
  <g stroke="#6b7280" stroke-width="2.5" fill="none" opacity="0.7">
    <path d="M 380 290 L 440 290" marker-end="url(#arrow)"/>
    <path d="M 760 290 L 820 290" marker-end="url(#arrow)"/>
  </g>

  <!-- 底部说明 -->
  <g transform="translate(0,500)">
    <rect x="80" y="0" width="1040" height="70" rx="8" fill="#1f2937"/>
    <text x="600" y="28" text-anchor="middle" font-size="13" font-weight="600" fill="#fde68a">底层逻辑</text>
    <text x="600" y="52" text-anchor="middle" font-size="13" fill="#e5e7eb">模型能力稀缺 → 价值集中模型；当能力商品化 → 价值向应用迁移；Agent 时代 → 价值向控制点迁移</text>
  </g>
</svg>
